#
# Attack configuration for S2-2 - partial BAG violation
# Intermediate severity level added to trace the response curve between the
# 4x (isolation intact) and 10x (isolation collapses) points already run.
#
# Topology: shared-ES isolation: VL1, VL2, VL3 all hosted on ES0 (two partitions)
#
# ES0 hosts the attacked VL (VL1). Its regulator is replaced with the partial
# violation variant: instead of bypassing BAG pacing entirely (S2-1), it paces
# against a reduced BAG:
#     BAG_effective = BAG_declared * 0.125 = 0.125ms  (rate = 8x declared BAG)
# The declared BAG carried by the frames stays 1 ms, so the switch still polices
# VL1 against the contract the ES claims to respect.
#
# Source period in the .xlsx is set to 0.125ms to match BAG_effective: the ES
# emits a steady stream at 8x its allowed rate with no backlog in the
# regulator queue itself (see Simulator_Limitations 2.5 on why a faster source
# with the same factor would instead grow the per-VL queue and abort the run).
#
# Usage: ./ANCAT_run.sh exp-S2-2_s2_r8
#

**.ESGroup[0].regulatorType = "MaliciousRegulator_PartialViolation"
**.ESGroup[0].regulatorLogic.bagReductionFactor = 0.125
