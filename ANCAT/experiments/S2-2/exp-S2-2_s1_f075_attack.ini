#
# Attack configuration for S2-2 - partial BAG violation
#
# Topology: cross-ES isolation: VL1 alone on ES0, VL2-VL5 each on their own ES
#
# ES0 hosts the attacked VL (VL1). Its regulator is replaced with the partial
# violation variant: instead of bypassing BAG pacing entirely (S2-1), it paces
# against a reduced BAG:
#     BAG_effective = BAG_declared * 0.75 = 0.75 ms
# The declared BAG carried by the frames stays 1 ms, so the switch still polices
# VL1 against the contract the ES claims to respect.
#
# The source period in the .xlsx is set to 0.75ms to match BAG_effective: the ES
# emits a steady stream at 1.33333x its allowed rate with no backlog in the
# regulator queue. (A faster source with the same factor would grow the per-VL
# queue past maxVLIDQueueSize and abort the run - see Simulator_Limitations 2.5.)
#
# Usage: ./ANCAT_run.sh exp-S2-2_s1_f075
#

**.ESGroup[0].regulatorType = "MaliciousRegulator_PartialViolation"
**.ESGroup[0].regulatorLogic.bagReductionFactor = 0.75
