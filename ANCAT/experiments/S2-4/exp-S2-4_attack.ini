#
# Attack configuration for S2-4 — Weakening of A/B redundancy checking
#
# ES5 is the destination End System that VL1-VL5 all converge on (topology
# reused unchanged from S2-1 Scenario 1). Its receive-side redundancy checker
# is disabled entirely: instead of keeping the first of the two A/B copies of
# each frame and discarding the second as a duplicate, it forwards everything
# it receives from both networks.
#
# Traffic is left fully compliant on every VL in this run (no BAG bypass, no
# burst) — this isolates the effect of the weakened redundancy check itself
# from every other attack already covered by S2-1/S2-2/S2-3.
#
# Expected effect: every VL delivered to ES5 (VL1-VL5) is delivered exactly
# twice per generated frame, since under fault-free conditions the A and B
# copies always arrive at the same simulated instant (see
# Simulator_Limitations.md §2.10) and would otherwise both be filtered down
# to one by this same check.
#
# Usage: place this file alongside exp-S2-4.xlsx in experiments/S2-4/.
#        ANCAT_run.sh will automatically pass it to the simulator.
#

**.ESGroup[5].redundancyChecker.enabled = false
