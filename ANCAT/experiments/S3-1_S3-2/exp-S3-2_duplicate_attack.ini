#
# Attack configuration for S3-2 — Unauthorized VL duplication (disclosure)
#
# No .ini override here, for the same reason as exp-S3-1_redirect_attack.ini:
# the attack is expressed through the "Destination ES" column of the
# experiment .xlsx, not through a config patch. VLRouter's routing table
# already supports multiple ports per VL-ID (used natively for legitimate
# multicast); listing an extra End System not intended for this VL as an
# additional destination produces the same routing table a compromised
# switch would have after an extra port was added to a VL's entry.
#
# Compared to exp-S3-1_S3-2_baseline.xlsx, the only change is VL1's
# Destination ES: "ES1" (the only intended one) in the baseline, "ES1, ES2"
# here (intended destination kept, an unintended one added). VL2 is left
# untouched in both, as a control.
#
# This file exists only so ANCAT_run.sh recognizes exp-S3-2_duplicate as an
# attack run and labels the report accordingly; it carries no override.
#
