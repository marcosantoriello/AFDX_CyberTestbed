#
# Attack configuration for S3-1 — Routing table poisoning (redirect)
#
# No .ini override here: unlike other attacks in this set, this one is
# expressed entirely through the "Destination ES" column of the experiment
# .xlsx, not through a config patch. The switch's VL-to-port routing table
# (SW0.txt) is generated by PreProcessor.py directly from that column, so
# declaring the wrong destination in the experiment definition already
# produces the same VL routing table a compromised switch would have.
#
# This is deliberate, not a shortcut: `configTableName` is already set by
# AutoNetwork.ini for every switch (see PreProcessor.py), so a second
# override of the same key in this file would not take effect, the same
# issue already documented for `redundancyChecker.skewMax` in S2-4.
#
# Compared to exp-S3-1_S3-2_baseline.xlsx, the only change is VL1's
# Destination ES: ES1 (the intended one) in the baseline, ES2 (not intended
# for this VL) here. VL2 is left untouched in both, as a control.
#
# This file exists only so ANCAT_run.sh recognizes exp-S3-1_redirect as an
# attack run and labels the report accordingly; it carries no override.
#
