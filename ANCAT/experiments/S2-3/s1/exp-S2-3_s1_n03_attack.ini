#
# Attack configuration for S2-3 - periodic burst injection (topology 1: isolation across End Systems)
#
# Topology: same as S2-1/S2-2 scenario 1, reused unchanged (exp-ES1-1_baseline.xlsx).
# VL1 (ES0) is the attacked VL, VL2-VL5 (ES1-ES4) remain fully compliant.
#
# Unlike S2-1/S2-2, the source period for VL1 is NOT changed: it stays at its
# nominal, compliant value (1 ms = declared BAG). Only the regulator on ES0
# changes: instead of pacing every VL honestly, it accumulates burstSize (3)
# frames of VL1 and releases them together in the same simulation instant,
# then resumes accumulating. Average VL1 rate stays exactly at the declared
# contract - only the release timing changes. VL2-VL5 are not on this ES and
# are unaffected by construction.
#
# Usage: ./ANCAT_run.sh exp-S2-3_s1_n03
#

**.ESGroup[0].regulatorType = "MaliciousRegulator_Burst"
**.ESGroup[0].regulatorLogic.targetVLID = 0x1
**.ESGroup[0].regulatorLogic.burstSize = 3
