#
# Attack configuration for S2-3 - periodic burst injection (topology 2: isolation within a shared End System)
#
# Topology: same as S2-1/S2-2 scenario 2, reused unchanged (exp-ES1-2_baseline.xlsx).
# ES0 hosts VL1 (attacked, Partition 1), VL2/VL3 (innocent, Partition 2) sharing
# the same regulator/transmit queue/link. VL4-VL7 are on separate ES and stay
# fully compliant.
#
# The source period for VL1 is NOT changed: it stays at its nominal, compliant
# value (1 ms = declared BAG). The regulator on ES0 accumulates burstSize (5)
# frames of VL1 and releases them together in the same simulation instant, then
# resumes accumulating - average VL1 rate stays exactly at the declared
# contract. VL2/VL3 pass through the same regulator instance but are paced
# honestly (targetVLID selects only VL1 for burst shaping), so they stay
# genuinely innocent traffic, consistent with the ARINC 653 partition model
# already used for S2-1/S2-2 scenario 2.
#
# Usage: ./ANCAT_run.sh exp-S2-3_s2_n05
#

**.ESGroup[0].regulatorType = "MaliciousRegulator_Burst"
**.ESGroup[0].regulatorLogic.targetVLID = 0x1
**.ESGroup[0].regulatorLogic.burstSize = 5
